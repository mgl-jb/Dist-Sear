name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      # Warnings are errors in this repo, so a clean build is a real gate rather than a formality.
      - name: Build
        run: dotnet build --no-restore -c Release

      # These need no Docker: every Azure dependency has an in-process implementation, so the whole
      # cluster -- routing, recovery, fan-out -- is exercised here.
      - name: Test
        run: >
          dotnet test --no-build -c Release
          --filter "Category!=Integration"
          --logger "trx;LogFileName=results.trx"
          --results-directory artifacts/tests

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: artifacts/tests

  emulator-tests:
    name: Emulator integration tests
    runs-on: ubuntu-latest

    services:
      cosmos:
        # The .NET SDK does not support the emulator's HTTP mode, so it runs with TLS and the tests
        # opt into trusting its self-signed certificate.
        image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
        ports:
          - 8081:8081
        env:
          PROTOCOL: https

      azurite:
        image: mcr.microsoft.com/azure-storage/azurite:latest
        ports:
          - 10000:10000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Wait for the Cosmos emulator
        run: |
          for i in $(seq 1 60); do
            if curl -ksf https://localhost:8081/_explorer/emulator.pem -o /dev/null; then
              echo "Emulator ready after ${i} attempts."
              exit 0
            fi
            sleep 5
          done
          echo "Cosmos emulator did not become ready." >&2
          exit 1

      - name: Run emulator-backed tests
        env:
          DISTSEAR_TEST_COSMOS: https://localhost:8081/
          DISTSEAR_TEST_COSMOS_KEY: C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
          DISTSEAR_TEST_BLOB: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://localhost:10000/devstoreaccount1;"
        run: dotnet test -c Release --filter "Category=Integration"

  infrastructure:
    name: Validate infrastructure
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint Bicep
        run: az bicep build --file deploy/bicep/main.bicep --outfile /dev/null

  images:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build

    strategy:
      matrix:
        project: [ DistSear.Coordinator, DistSear.Node ]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built but not pushed: publishing is a deployment decision, not a CI one.
      - name: Build ${{ matrix.project }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          build-args: PROJECT=${{ matrix.project }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
